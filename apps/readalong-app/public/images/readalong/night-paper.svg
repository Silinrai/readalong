<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Readalong: dim warm paper for night reading. Original. -->
  <filter id="fibres" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="13" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 -1.2 0.8"/>
  </filter>
  <filter id="blotches" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" seed="21" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.30  0 0 0 0 0.22  0 0 0 0 0.14  0 0 0 -1.6 1.05"/>
  </filter>
  <rect width="400" height="400" fill="#2b2520"/>
  <rect width="400" height="400" filter="url(#blotches)" opacity="0.6"/>
  <rect width="400" height="400" filter="url(#fibres)" opacity="0.25"/>
</svg>
