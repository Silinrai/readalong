<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Readalong: warm aged paper. Original, generated with SVG noise. -->
  <filter id="fibres" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.33  0 0 0 0 0.18  0 0 0 -1.1 0.75"/>
  </filter>
  <filter id="blotches" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.62  0 0 0 0 0.47  0 0 0 0 0.26  0 0 0 -1.6 1.05"/>
  </filter>
  <rect width="400" height="400" fill="#f4ead2"/>
  <rect width="400" height="400" filter="url(#blotches)" opacity="0.55"/>
  <rect width="400" height="400" filter="url(#fibres)" opacity="0.35"/>
</svg>
