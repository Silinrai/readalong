<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <!-- Readalong: oak wood grain (library shelves, warm backgrounds). Original. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.12" numOctaves="4" seed="17" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.36  0 0 0 0 0.22  0 0 0 0 0.11  0 0 0 -2 1.25"/>
  </filter>
  <filter id="pores" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.8" numOctaves="2" seed="29" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.25  0 0 0 0 0.14  0 0 0 0 0.07  0 0 0 -1.4 0.9"/>
  </filter>
  <rect width="600" height="300" fill="#a8743f"/>
  <rect width="600" height="300" filter="url(#grain)" opacity="0.7"/>
  <rect width="600" height="300" filter="url(#pores)" opacity="0.3"/>
</svg>
