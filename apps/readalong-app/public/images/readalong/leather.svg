<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Readalong: dark brown leather grain, for night reading. Original. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="turbulence" baseFrequency="0.22" numOctaves="4" seed="5" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.60  0 0 0 0 0.42  0 0 0 0 0.28  0 0 0 -1.4 0.95"/>
  </filter>
  <filter id="shade" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.10  0 0 0 0 0.06  0 0 0 0 0.04  0 0 0 -1.5 1.1"/>
  </filter>
  <rect width="400" height="400" fill="#3a271c"/>
  <rect width="400" height="400" filter="url(#shade)" opacity="0.6"/>
  <rect width="400" height="400" filter="url(#grain)" opacity="0.35"/>
</svg>
